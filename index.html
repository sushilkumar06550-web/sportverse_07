<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SportVerse — Sports Graphic Design</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Barlow+Condensed:wght@500;600;700&family=Barlow:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --black:#08090c;
    --navy:#0d1c3a;
    --navy-2:#132a52;
    --orange:#ff5a1f;
    --orange-2:#ff8a3d;
    --red:#c81a12;
    --gold:#c9973a;
    --off:#f3f1ea;
    --off-dim:rgba(243,241,234,0.65);
    --line: rgba(243,241,234,0.12);
  }
  *{margin:0;padding:0;box-sizing:border-box;}
  html{scroll-behavior:smooth;}
  body{background:var(--black);color:var(--off);font-family:'Barlow',sans-serif;overflow-x:hidden;}
  h1,h2,h3,.display{font-family:'Anton',sans-serif;text-transform:uppercase;letter-spacing:0.5px;line-height:0.94;}
  .eyebrow{font-family:'Barlow Condensed',sans-serif;text-transform:uppercase;letter-spacing:3px;font-weight:600;font-size:13px;color:var(--orange-2);}
  a{color:inherit;text-decoration:none;}
  img{display:block;max-width:100%;}
  .wrap{max-width:1180px;margin:0 auto;padding:0 24px;}

  /* NAV */
  nav{position:fixed;top:0;left:0;right:0;z-index:50;background:rgba(8,9,12,0.85);backdrop-filter:blur(10px);border-bottom:1px solid var(--line);}
  nav .wrap{display:flex;align-items:center;justify-content:space-between;height:72px;}
  .brand{display:flex;align-items:center;gap:10px;}
  .brand img{height:32px;width:auto;}
  .brand span{font-family:'Anton',sans-serif;font-size:19px;letter-spacing:0.5px;}
  .nav-links{display:flex;gap:32px;font-family:'Barlow Condensed',sans-serif;font-weight:600;letter-spacing:1px;text-transform:uppercase;font-size:14px;}
  .nav-links a{opacity:0.8;transition:opacity .2s, color .2s;}
  .nav-links a:hover{opacity:1;color:var(--orange-2);}
  .nav-cta{background:var(--orange);color:#08090c;font-family:'Barlow Condensed',sans-serif;font-weight:700;text-transform:uppercase;letter-spacing:1px;font-size:14px;padding:10px 20px;border-radius:2px;clip-path:polygon(8px 0,100% 0,calc(100% - 8px) 100%,0 100%);}
  @media(max-width:760px){.nav-links{display:none;}}

  /* HERO */
  .hero{position:relative;min-height:100vh;display:flex;align-items:flex-end;padding-top:72px;overflow:hidden;
    background:radial-gradient(ellipse 80% 60% at 15% 10%, rgba(255,90,31,0.14), transparent 60%),
               radial-gradient(ellipse 60% 50% at 100% 0%, rgba(19,42,82,0.55), transparent 60%),
               var(--black);
  }
  .streak{position:absolute;background:linear-gradient(100deg,var(--orange-2),var(--orange) 45%,var(--red));clip-path:polygon(0 40%, 100% 0, 100% 20%, 0 60%);}
  .streak-1{width:150%;height:200px;top:6%;left:-25%;transform:rotate(-8deg);opacity:0.85;}
  .streak-2{width:150%;height:110px;top:17%;left:-35%;transform:rotate(-8deg);opacity:0.3;filter:blur(1px);}
  .hero .wrap{position:relative;z-index:2;display:grid;grid-template-columns:1.1fr 0.9fr;gap:20px;align-items:end;width:100%;padding-top:100px;}
  .hero-copy{padding-bottom:70px;}
  .hero h1{font-size:clamp(42px,6.6vw,80px);color:var(--off);}
  .hero h1 em{font-style:normal;color:var(--orange);}
  .hero p.lead{margin-top:18px;font-size:18px;max-width:440px;color:var(--off-dim);}
  .hero-ctas{margin-top:30px;display:flex;gap:14px;flex-wrap:wrap;}
  .btn{display:inline-flex;align-items:center;gap:8px;font-family:'Barlow Condensed',sans-serif;font-weight:700;text-transform:uppercase;letter-spacing:1px;font-size:15px;padding:14px 26px;border-radius:2px;clip-path:polygon(10px 0,100% 0,calc(100% - 10px) 100%,0 100%);}
  .btn-primary{background:var(--orange);color:#08090c;}
  .btn-primary:hover{background:var(--orange-2);}
  .btn-outline{border:1.5px solid rgba(243,241,234,0.4);color:var(--off);}
  .btn-outline:hover{border-color:var(--orange-2);color:var(--orange-2);}
  .hero-art{position:relative;display:flex;justify-content:center;align-items:flex-end;height:100%;}
  .hero-art img{width:100%;max-width:460px;mask-image:radial-gradient(ellipse 75% 85% at 50% 55%, black 60%, transparent 92%);-webkit-mask-image:radial-gradient(ellipse 75% 85% at 50% 55%, black 60%, transparent 92%);filter:drop-shadow(0 10px 40px rgba(255,90,31,0.2));}
  @media(max-width:900px){.hero .wrap{grid-template-columns:1fr;padding-top:60px;}.hero-copy{padding-bottom:20px;}.hero-art{order:-1;max-width:280px;margin:0 auto;}}

  /* SECTION */
  .section{padding:100px 0;}
  .section-head{margin-bottom:52px;max-width:640px;}
  .section-head h2{font-size:clamp(32px,4.4vw,50px);margin-top:8px;}
  .section-head p{margin-top:14px;color:var(--off-dim);font-size:17px;}
  .rule{height:2px;width:64px;background:linear-gradient(90deg,var(--orange),var(--red));margin-top:6px;}

  /* SERVICES */
  .services{background:var(--navy);position:relative;}
  .services::before{content:"";position:absolute;top:0;left:0;right:0;height:1px;background:linear-gradient(90deg,transparent,var(--orange),transparent);}
  .price-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;}
  @media(max-width:900px){.price-grid{grid-template-columns:repeat(2,1fr);}}
  @media(max-width:600px){.price-grid{grid-template-columns:1fr;}}
  .price-card{background:rgba(8,9,12,0.5);border:1px solid rgba(243,241,234,0.1);border-radius:4px;padding:24px 22px;position:relative;transition:transform .25s, border-color .25s, background .25s;}
  .price-card:hover{transform:translateY(-4px);border-color:var(--orange);background:rgba(8,9,12,0.75);}
  .price-tag{font-family:'Anton',sans-serif;font-size:32px;color:var(--orange-2);line-height:1;}
  .price-tag sup{font-size:15px;top:-13px;}
  .price-card h4{font-family:'Barlow Condensed',sans-serif;text-transform:uppercase;font-weight:700;font-size:16px;letter-spacing:0.3px;margin-top:12px;color:var(--off);}
  .price-card p{margin-top:6px;font-size:14px;color:var(--off-dim);}
  .price-card.featured{border-color:var(--gold);background:rgba(201,151,58,0.08);}
  .price-card.featured .price-tag{color:var(--gold);}
  .badge-num{position:absolute;top:-10px;right:16px;font-family:'Barlow Condensed',sans-serif;font-weight:700;font-size:11px;background:var(--black);border:1px solid rgba(243,241,234,0.2);color:rgba(243,241,234,0.55);padding:3px 9px;border-radius:20px;letter-spacing:1px;}

  /* PORTFOLIO — light spotlight cards on dark section */
  .work-grid{display:grid;grid-template-columns:repeat(5,1fr);gap:16px;}
  @media(max-width:900px){.work-grid{grid-template-columns:repeat(3,1fr);}}
  @media(max-width:600px){.work-grid{grid-template-columns:repeat(2,1fr);}}
  .work-card{background:var(--off);border-radius:8px;overflow:hidden;transition:transform .25s, box-shadow .25s;}
  .work-card:hover{transform:translateY(-6px);box-shadow:0 16px 34px rgba(0,0,0,0.4);}
  .work-card .img-box{aspect-ratio:1/1;display:flex;align-items:center;justify-content:center;padding:22px;}
  .work-card .img-box img{max-height:100%;object-fit:contain;}
  .work-card .cap{padding:12px 14px 16px;border-top:1px solid rgba(8,9,12,0.1);}
  .work-card .cap .eyebrow{font-size:10px;color:var(--red);}
  .work-card .cap h5{font-family:'Barlow Condensed',sans-serif;font-weight:700;font-size:14px;margin-top:3px;text-transform:uppercase;color:var(--black);}

  /* STRIP */
  .strip{background:var(--black);border-top:1px solid var(--line);border-bottom:1px solid var(--line);padding:56px 0;}
  .strip .wrap{display:grid;grid-template-columns:repeat(4,1fr);gap:24px;text-align:center;}
  @media(max-width:760px){.strip .wrap{grid-template-columns:repeat(2,1fr);}}
  .strip .stat h3{font-size:36px;color:var(--orange);}
  .strip .stat p{margin-top:6px;font-family:'Barlow Condensed',sans-serif;text-transform:uppercase;letter-spacing:1px;font-size:12px;color:var(--off-dim);}

  /* CONTACT */
  .contact{background:linear-gradient(180deg,var(--navy),var(--black));}
  .contact-box{display:grid;grid-template-columns:1fr 1fr;gap:40px;align-items:center;background:rgba(8,9,12,0.5);border:1px solid var(--line);border-radius:8px;padding:52px;}
  @media(max-width:800px){.contact-box{grid-template-columns:1fr;padding:32px;}}
  .contact h2{font-size:clamp(30px,4vw,44px);}
  .contact-links{display:flex;flex-direction:column;gap:14px;}
  .contact-item{display:flex;align-items:center;gap:14px;padding:16px 18px;border:1px solid rgba(243,241,234,0.15);border-radius:4px;transition:border-color .2s, background .2s;}
  .contact-item:hover{border-color:var(--orange);background:rgba(255,90,31,0.06);}
  .contact-item .ic{width:38px;height:38px;border-radius:50%;background:var(--orange);color:#08090c;display:flex;align-items:center;justify-content:center;font-weight:700;font-family:'Barlow Condensed',sans-serif;flex-shrink:0;}
  .contact-item .t{font-family:'Barlow Condensed',sans-serif;font-size:12px;letter-spacing:1px;text-transform:uppercase;color:var(--off-dim);}
  .contact-item .v{font-weight:600;font-size:16px;}

  footer{padding:30px 0;text-align:center;font-family:'Barlow Condensed',sans-serif;font-size:13px;letter-spacing:1px;color:rgba(243,241,234,0.4);border-top:1px solid var(--line);}
</style>
</head>
